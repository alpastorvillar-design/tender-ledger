name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: postgres
          # Disposable CI service only; unrelated to development credentials.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory 2g
          --cpus 2
          --shm-size 256m
    env:
      TL_DB_HOST: 127.0.0.1
      TL_DB_PORT: "5432"
      TL_DB_USER: postgres
      TL_DB_PASSWORD: ci-only-password
      TL_TEST_DB: tender_ledger_ci_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.3"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        run: python -m ruff check src tests scripts --no-cache
      - name: Test with PostgreSQL (no skips)
        run: python scripts/run_tests.py
